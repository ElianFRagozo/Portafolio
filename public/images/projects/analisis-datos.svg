<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="ad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e2a"/>
      <stop offset="100%" stop-color="#060816"/>
    </linearGradient>
    <radialGradient id="ad-glow" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ad-glow2" cx="0.85" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ad-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="ad-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ad-bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#ad-bg)"/>
  <rect width="800" height="400" fill="url(#ad-glow)"/>
  <rect width="800" height="400" fill="url(#ad-glow2)"/>

  <!-- Grid -->
  <g stroke="#00e5ff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>

  <!-- Dashboard panel -->
  <g transform="translate(440, 70)">
    <rect x="0" y="0" width="300" height="260" rx="14" fill="#0a1428" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Header -->
    <text x="20" y="32" font-family="monospace" font-size="11" font-weight="700" fill="#aab4cc">DASHBOARD · ANALYTICS</text>
    <circle cx="280" cy="28" r="4" fill="#00ff88"/>

    <!-- Bar chart -->
    <g transform="translate(20, 60)">
      <line x1="0" y1="120" x2="260" y2="120" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="10" y="80" width="22" height="40" rx="3" fill="url(#ad-bar)"/>
      <rect x="44" y="55" width="22" height="65" rx="3" fill="url(#ad-bar)"/>
      <rect x="78" y="40" width="22" height="80" rx="3" fill="url(#ad-bar2)"/>
      <rect x="112" y="20" width="22" height="100" rx="3" fill="url(#ad-bar2)"/>
      <rect x="146" y="50" width="22" height="70" rx="3" fill="url(#ad-bar)"/>
      <rect x="180" y="30" width="22" height="90" rx="3" fill="url(#ad-bar2)"/>
      <rect x="214" y="65" width="22" height="55" rx="3" fill="url(#ad-bar)"/>

      <!-- Trend line overlay -->
      <path d="M 21 95 L 55 70 L 89 50 L 123 25 L 157 60 L 191 35 L 225 70" stroke="#00ff88" stroke-width="2" fill="none" stroke-linecap="round"
            filter="drop-shadow(0 0 4px #00ff88)"/>
      <circle cx="21" cy="95" r="3" fill="#00ff88"/>
      <circle cx="55" cy="70" r="3" fill="#00ff88"/>
      <circle cx="89" cy="50" r="3" fill="#00ff88"/>
      <circle cx="123" cy="25" r="3" fill="#fff"/>
      <circle cx="157" cy="60" r="3" fill="#00ff88"/>
      <circle cx="191" cy="35" r="3" fill="#00ff88"/>
      <circle cx="225" cy="70" r="3" fill="#00ff88"/>
    </g>

    <!-- KPIs -->
    <g transform="translate(20, 210)" font-family="monospace">
      <text x="0" y="0" font-size="9" font-weight="700" fill="#aab4cc">VENTAS</text>
      <text x="0" y="22" font-family="system-ui" font-size="20" font-weight="900" fill="#00e5ff">+34%</text>
      <text x="100" y="0" font-size="9" font-weight="700" fill="#aab4cc">USUARIOS</text>
      <text x="100" y="22" font-family="system-ui" font-size="20" font-weight="900" fill="#00ff88">12.4k</text>
      <text x="200" y="0" font-size="9" font-weight="700" fill="#aab4cc">ROI</text>
      <text x="200" y="22" font-family="system-ui" font-size="20" font-weight="900" fill="#fff">2.8x</text>
    </g>
  </g>

  <!-- Title -->
  <text x="60" y="180" font-family="system-ui" font-size="42" font-weight="900" fill="url(#ad-text)" letter-spacing="-1">Análisis de</text>
  <text x="60" y="222" font-family="system-ui" font-size="42" font-weight="900" fill="url(#ad-text)" letter-spacing="-1">Datos</text>
  <text x="60" y="252" font-family="system-ui" font-size="16" font-weight="500" fill="#aab4cc">Insights y visualizaciones con</text>
  <text x="60" y="272" font-family="system-ui" font-size="16" font-weight="500" fill="#aab4cc">Python y machine learning</text>

  <!-- Tech badges -->
  <g font-family="monospace" font-size="13" font-weight="700">
    <rect x="60" y="305" width="74" height="30" rx="15" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-opacity="0.4"/>
    <text x="97" y="324" fill="#00e5ff" text-anchor="middle">Python</text>
    <rect x="142" y="305" width="74" height="30" rx="15" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-opacity="0.4"/>
    <text x="179" y="324" fill="#00ff88" text-anchor="middle">Pandas</text>
    <rect x="224" y="305" width="74" height="30" rx="15" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="261" y="324" fill="#c4a3ff" text-anchor="middle">Jupyter</text>
  </g>

  <!-- Top-left tag -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-opacity="0.5"/>
    <circle cx="14" cy="13" r="3" fill="#00e5ff"/>
    <text x="24" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#00e5ff">DATA SCIENCE</text>
  </g>
</svg>

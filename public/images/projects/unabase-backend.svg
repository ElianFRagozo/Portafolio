<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="ub-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e2a"/>
      <stop offset="100%" stop-color="#060816"/>
    </linearGradient>
    <radialGradient id="ub-glow" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ub-glow2" cx="0.85" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ub-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#ub-bg)"/>
  <rect width="800" height="400" fill="url(#ub-glow)"/>
  <rect width="800" height="400" fill="url(#ub-glow2)"/>

  <!-- Grid pattern -->
  <g stroke="#00e5ff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>

  <!-- Document icon -->
  <g transform="translate(540, 90)">
    <rect x="0" y="0" width="160" height="200" rx="12" fill="#0e1230" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="20" y1="40" x2="120" y2="40" stroke="#00e5ff" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round"/>
    <line x1="20" y1="65" x2="140" y2="65" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>
    <line x1="20" y1="85" x2="100" y2="85" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>
    <line x1="20" y1="105" x2="130" y2="105" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>
    <rect x="20" y="130" width="60" height="50" rx="6" fill="#00e5ff" fill-opacity="0.12" stroke="#00ff88" stroke-width="1.5"/>
    <text x="50" y="160" font-family="monospace" font-size="13" fill="#00ff88" text-anchor="middle" font-weight="700">$420</text>
  </g>

  <!-- Arrow flow -->
  <path d="M 470 190 Q 510 190 530 190" stroke="#00e5ff" stroke-width="2" fill="none" stroke-dasharray="4 4" opacity="0.7"/>
  <polygon points="525,184 538,190 525,196" fill="#00e5ff" opacity="0.7"/>

  <!-- AI core -->
  <g transform="translate(380, 130)">
    <circle cx="60" cy="60" r="55" fill="#0e1230" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="60" cy="60" r="40" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="60" cy="60" r="25" fill="#a855f7" fill-opacity="0.15"/>
    <text x="60" y="68" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#fff" text-anchor="middle">AI</text>
  </g>

  <!-- Title -->
  <text x="60" y="220" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="url(#ub-text)" letter-spacing="-1">Unabase API</text>
  <text x="60" y="252" font-family="system-ui, sans-serif" font-size="17" font-weight="500" fill="#aab4cc">Procesamiento inteligente de</text>
  <text x="60" y="274" font-family="system-ui, sans-serif" font-size="17" font-weight="500" fill="#aab4cc">documentos fiscales con IA</text>

  <!-- Tech badges -->
  <g font-family="monospace" font-size="13" font-weight="700">
    <rect x="60" y="305" width="74" height="30" rx="15" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-opacity="0.4"/>
    <text x="97" y="324" fill="#00e5ff" text-anchor="middle">Python</text>
    <rect x="142" y="305" width="80" height="30" rx="15" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-opacity="0.4"/>
    <text x="182" y="324" fill="#00ff88" text-anchor="middle">FastAPI</text>
    <rect x="230" y="305" width="78" height="30" rx="15" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="269" y="324" fill="#c4a3ff" text-anchor="middle">OpenAI</text>
  </g>

  <!-- Top-left tag -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="76" height="26" rx="13" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-opacity="0.5"/>
    <circle cx="14" cy="13" r="3" fill="#00ff88"/>
    <text x="24" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#00ff88">BACKEND</text>
  </g>
</svg>

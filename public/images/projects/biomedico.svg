<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a1f"/>
      <stop offset="100%" stop-color="#060816"/>
    </linearGradient>
    <radialGradient id="bm-glow" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bm-glow2" cx="0.85" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bm-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bm-bg)"/>
  <rect width="800" height="400" fill="url(#bm-glow)"/>
  <rect width="800" height="400" fill="url(#bm-glow2)"/>

  <!-- Grid -->
  <g stroke="#00ff88" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>

  <!-- Heart rate monitor screen -->
  <g transform="translate(440, 100)">
    <rect x="0" y="0" width="300" height="200" rx="14" fill="#0a1820" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- ECG line -->
    <path d="M 20 100 L 60 100 L 75 100 L 85 60 L 100 140 L 115 100 L 160 100 L 175 100 L 185 65 L 200 135 L 215 100 L 280 100"
          stroke="#00ff88" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"
          filter="drop-shadow(0 0 6px #00ff88)"/>
    <!-- BPM label -->
    <text x="20" y="35" font-family="monospace" font-size="11" font-weight="700" fill="#00ff88" opacity="0.7">BPM</text>
    <text x="20" y="56" font-family="system-ui" font-size="22" font-weight="900" fill="#fff">142</text>
    <text x="270" y="56" font-family="monospace" font-size="11" font-weight="700" fill="#00e5ff" opacity="0.7" text-anchor="end">PEAK</text>
    <!-- Stats row -->
    <g transform="translate(20, 160)" font-family="monospace" font-size="10" font-weight="700">
      <text x="0" y="0" fill="#aab4cc">VO2: <tspan fill="#00ff88">52.4</tspan></text>
      <text x="100" y="0" fill="#aab4cc">CAL: <tspan fill="#00e5ff">340</tspan></text>
      <text x="200" y="0" fill="#aab4cc">DIST: <tspan fill="#00ff88">8.4km</tspan></text>
    </g>
  </g>

  <!-- Athlete pulse circle -->
  <g transform="translate(330, 165)">
    <circle cx="40" cy="40" r="60" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="40" cy="40" r="48" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="40" cy="40" r="36" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-width="1.5"/>
    <!-- Heart icon -->
    <path d="M 40 30 C 32 22 22 28 22 38 C 22 48 40 60 40 60 C 40 60 58 48 58 38 C 58 28 48 22 40 30 Z" fill="#00ff88" opacity="0.9"/>
  </g>

  <!-- Title -->
  <text x="60" y="200" font-family="system-ui" font-size="38" font-weight="900" fill="url(#bm-text)" letter-spacing="-0.8">AtletaIntegro</text>
  <text x="60" y="232" font-family="system-ui" font-size="16" font-weight="500" fill="#aab4cc">Plataforma biomédica para</text>
  <text x="60" y="252" font-family="system-ui" font-size="16" font-weight="500" fill="#aab4cc">monitoreo de atletas</text>

  <!-- Tech badges -->
  <g font-family="monospace" font-size="13" font-weight="700">
    <rect x="60" y="285" width="64" height="30" rx="15" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-opacity="0.4"/>
    <text x="92" y="304" fill="#00ff88" text-anchor="middle">Vue.js</text>
    <rect x="132" y="285" width="74" height="30" rx="15" fill="#00e5ff" fill-opacity="0.12" stroke="#00e5ff" stroke-opacity="0.4"/>
    <text x="169" y="304" fill="#00e5ff" text-anchor="middle">Node.js</text>
    <rect x="214" y="285" width="50" height="30" rx="15" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="239" y="304" fill="#c4a3ff" text-anchor="middle">SQL</text>
  </g>

  <!-- Top-left tag -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="92" height="26" rx="13" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-opacity="0.5"/>
    <circle cx="14" cy="13" r="3" fill="#00ff88"/>
    <text x="24" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#00ff88">FULL STACK</text>
  </g>
</svg>

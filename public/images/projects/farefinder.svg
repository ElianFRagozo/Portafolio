<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="ff-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a2a"/>
      <stop offset="100%" stop-color="#060816"/>
    </linearGradient>
    <radialGradient id="ff-glow" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ff-glow2" cx="0.85" cy="0.85" r="0.5">
      <stop offset="0%" stop-color="#ff66ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff66ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ff-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff66ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#ff-bg)"/>
  <rect width="800" height="400" fill="url(#ff-glow)"/>
  <rect width="800" height="400" fill="url(#ff-glow2)"/>

  <!-- Map grid -->
  <g stroke="#a855f7" stroke-opacity="0.08" stroke-width="1">
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
  </g>

  <!-- Phone mockup -->
  <g transform="translate(540, 50)">
    <rect x="0" y="0" width="180" height="320" rx="22" fill="#0a0e2a" stroke="#a855f7" stroke-width="2" stroke-opacity="0.5"/>
    <rect x="8" y="8" width="164" height="304" rx="16" fill="#060816"/>
    <!-- Map area -->
    <rect x="14" y="20" width="152" height="180" rx="10" fill="#0e1230"/>
    <!-- Roads -->
    <path d="M 14 100 Q 80 80 166 110" stroke="#a855f7" stroke-width="2" stroke-opacity="0.4" fill="none"/>
    <path d="M 60 20 L 70 200" stroke="#ff66ff" stroke-width="2" stroke-opacity="0.5" fill="none"/>
    <path d="M 14 150 L 166 145" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
    <!-- Route -->
    <path d="M 40 175 Q 70 130 100 110 Q 130 90 140 60" stroke="#ff66ff" stroke-width="3" fill="none" stroke-linecap="round"
          filter="drop-shadow(0 0 5px #ff66ff)"/>
    <!-- Pin start -->
    <circle cx="40" cy="175" r="6" fill="#00ff88"/>
    <circle cx="40" cy="175" r="10" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.6"/>
    <!-- Pin end -->
    <path d="M 140 50 C 134 50 130 54 130 60 C 130 68 140 78 140 78 C 140 78 150 68 150 60 C 150 54 146 50 140 50 Z" fill="#ff66ff"/>
    <circle cx="140" cy="60" r="3" fill="#fff"/>

    <!-- Fare card -->
    <rect x="14" y="215" width="152" height="86" rx="10" fill="#1a0a2a" stroke="#ff66ff" stroke-width="1" stroke-opacity="0.5"/>
    <text x="24" y="238" font-family="monospace" font-size="9" font-weight="700" fill="#aab4cc">TARIFA ESTIMADA</text>
    <text x="24" y="266" font-family="system-ui" font-size="22" font-weight="900" fill="#ff66ff">$8.500</text>
    <text x="24" y="285" font-family="monospace" font-size="9" fill="#aab4cc">12 min · 4.2 km</text>
    <rect x="100" y="248" width="56" height="36" rx="18" fill="#ff66ff"/>
    <text x="128" y="271" font-family="system-ui" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Pedir</text>
  </g>

  <!-- Title -->
  <text x="60" y="180" font-family="system-ui" font-size="46" font-weight="900" fill="url(#ff-text)" letter-spacing="-1">Fare Finder</text>
  <text x="60" y="220" font-family="system-ui" font-size="17" font-weight="500" fill="#c4b4dc">App de transporte privado con</text>
  <text x="60" y="244" font-family="system-ui" font-size="17" font-weight="500" fill="#c4b4dc">geolocalización en tiempo real</text>

  <!-- Tech badges -->
  <g font-family="monospace" font-size="13" font-weight="700">
    <rect x="60" y="280" width="68" height="30" rx="15" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="94" y="299" fill="#c4a3ff" text-anchor="middle">Flutter</text>
    <rect x="136" y="280" width="56" height="30" rx="15" fill="#ff66ff" fill-opacity="0.15" stroke="#ff66ff" stroke-opacity="0.5"/>
    <text x="164" y="299" fill="#ff99ff" text-anchor="middle">Dart</text>
    <rect x="200" y="280" width="84" height="30" rx="15" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-opacity="0.4"/>
    <text x="242" y="299" fill="#00ff88" text-anchor="middle">Firebase</text>
  </g>

  <!-- Top-left tag -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="68" height="26" rx="13" fill="#ff66ff" fill-opacity="0.15" stroke="#ff66ff" stroke-opacity="0.5"/>
    <circle cx="14" cy="13" r="3" fill="#ff66ff"/>
    <text x="24" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#ff99ff">MOBILE</text>
  </g>
</svg>
